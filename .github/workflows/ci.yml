name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_platform_test
        ports:
          - 5432:5432
        # Without a readiness probe the first migration races the server's
        # start-up and the job fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

      # The rate limiter's tests run against a real Redis for the same reason the isolation
      # tests run against a real Postgres: the behaviour being verified is "what happens when
      # the window slides, when the script runs, and when the connection is refused", and a
      # fake answers none of those. TEST_REDIS_URL points the suite here.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_platform_test?sslmode=disable
      DATABASE_URL: postgres://app_rw:app_rw@localhost:5432/tenant_platform_test?sslmode=disable
      TEST_MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://app_rw:app_rw@localhost:5432/tenant_platform_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: migrate
        run: go run ./cmd/migrate up

      # The isolation tests run against a real Postgres as the unprivileged
      # app_rw role. They fail rather than skip when the database is missing, so
      # a green run here is evidence the policies are in force.
      - name: test (race)
        run: go test -race -count=1 ./...
        env:
          TEST_REDIS_URL: redis://localhost:6379/1

      - name: build
        run: go build ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config

  # The stack is started and exercised, not just validated.
  #
  # `docker compose config` (above) proves the file parses. It cannot catch an entrypoint that
  # exits, a container that cannot resolve a service name, or a control that is active in the test
  # harness but not in the running binary. This job is that check: it builds the images, waits for
  # both processes to report ready, then runs the same script a developer runs locally — covering
  # registration, the rate-limit headers, an idempotent retry, the SSRF guard, tenant boundaries,
  # and the metrics each process exposes.
  #
  # Worth its two minutes, because it has already found three defects the Go suite could not see:
  # a refused webhook target answered 500 instead of 400, session responses omitted the
  # permissions they document, and the worker's outbox-depth gauge was absent — not zero — for as
  # long as the queue was empty.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: start the stack
        run: docker compose up -d --build

      - name: wait for both processes to be ready
        run: |
          for i in $(seq 1 60); do
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/readyz || true)
            worker=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:9090/readyz || true)
            if [ "$api" = "200" ] && [ "$worker" = "200" ]; then
              echo "api and worker are ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the stack did not become ready within 120s"
          docker compose ps
          exit 1

      - name: smoke test (the deployed path)
        run: python3 scripts/smoke_compose.py

      - name: stack logs
        if: failure()
        run: docker compose logs --no-color
