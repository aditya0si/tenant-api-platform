name: ci
on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenant_platform_test
        ports:
          - 5432:5432
        # Without a readiness probe the first migration races the server's
        # start-up and the job fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_platform_test?sslmode=disable
      DATABASE_URL: postgres://app_rw:app_rw@localhost:5432/tenant_platform_test?sslmode=disable
      TEST_MIGRATE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tenant_platform_test?sslmode=disable
      TEST_DATABASE_URL: postgres://app_rw:app_rw@localhost:5432/tenant_platform_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: migrate
        run: go run ./cmd/migrate up

      # The isolation tests run against a real Postgres as the unprivileged
      # app_rw role. They fail rather than skip when the database is missing, so
      # a green run here is evidence the policies are in force.
      - name: test (race)
        run: go test -race -count=1 ./...

      - name: build
        run: go build ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
