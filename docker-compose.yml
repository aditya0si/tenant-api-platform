services:
  postgres:
    image: postgres:16-alpine
    container_name: tap-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tenant_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tenant_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tap-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the migrations once, then exits. The API waits for it to complete so a
  # fresh `docker compose up` produces a migrated database instead of an API that
  # is up but failing every request.
  #
  # entrypoint is overridden because the image's default entrypoint is /bin/api;
  # without this the `command` would be passed as arguments to the API binary.
  migrate:
    build: .
    container_name: tap-migrate
    entrypoint: ["/bin/migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/tenant_platform?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: tap-api
    ports:
      - "8080:8080"
    environment:
      APP_ENV: dev
      PORT: "8080"
      # The API authenticates as the unprivileged application role, NOT as the
      # postgres superuser. Superusers and BYPASSRLS roles ignore row-level
      # security entirely, so connecting as postgres would make every tenant
      # policy in migrations/0001 decorative — the isolation tests would still
      # pass, because they would be measuring application-level filtering only.
      # The role is created by the migration and provisioned out-of-band in
      # production (see docs/adr/ADR-003-tenancy-and-rls.md).
      DATABASE_URL: postgres://app_rw:app_rw@postgres:5432/tenant_platform?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Delivers webhook events from the outbox.
  #
  # This service is not optional, and its absence is the failure worth naming: without it the
  # API accepts endpoint registrations, enqueues deliveries inside its transactions, and
  # nothing ever sends them. The system would look entirely healthy — registrations succeed,
  # the delivery history fills with `pending` rows — while every tenant's integration silently
  # received nothing. A half-feature that reports success is worse than a missing one.
  #
  # It runs the same image as the API with a different entrypoint, so the two cannot drift to
  # different builds of the same commit.
  worker:
    build: .
    container_name: tap-worker
    entrypoint: ["/bin/worker"]
    ports:
      # Metrics and health on their own port. Published for local development so the depth
      # gauge is readable; in production this listener stays on the internal network, because
      # the outbox depth is operational data about every tenant's delivery backlog.
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://app_rw:app_rw@postgres:5432/tenant_platform?sslmode=disable
      WORKER_METRICS_PORT: "9090"
      WORKER_BATCH_SIZE: "10"
      WORKER_INTERVAL: 1s
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # A healthcheck on the metrics listener, so `docker compose ps` distinguishes a worker
    # that is delivering from one that exited. The endpoint checks the database, not just the
    # process: a worker whose connection is gone cannot claim or settle anything, and
    # reporting it healthy would hide a stalled queue.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/readyz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
